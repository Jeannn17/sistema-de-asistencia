# Sitio único: la raíz web es public/ (el front controller y los archivos estáticos)
# El puerto lo fija docker/iniciar.sh con la variable PORT que entrega Render.
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/jane/public

    # Defensa extra: aunque el servidor se configure mal, nada fuera de public/ se sirve
    <Directory /var/www/jane>
        Require all denied
    </Directory>
    <Directory /var/www/jane/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ServerSignature Off
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

ServerTokens Prod
