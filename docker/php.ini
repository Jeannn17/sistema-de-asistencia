; Ajustes de PHP para producción (se suman al php.ini por defecto de la imagen)
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
max_execution_time = 60

; El informe del biométrico puede pesar hasta 10 MB (AsistenciaModel::MAX_BYTES)
upload_max_filesize = 12M
post_max_size = 14M

date.timezone = America/Caracas

; Sesiones: la cookie la configura public/index.php (HttpOnly, SameSite=Strict, Secure con HTTPS)
session.use_strict_mode = 1
session.gc_maxlifetime = 7200

opcache.enable = 1
opcache.validate_timestamps = 0
